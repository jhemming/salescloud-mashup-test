<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Cloud v2 Event Debugger</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
    .status { padding: 12px; border: 1px solid #bbb; border-radius: 6px; margin-bottom: 16px; }
    pre { padding: 12px; background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h2>Sales Cloud v2 – Event Debugger</h2>
  <div class="status" id="status">Mashup geladen. Warte auf ein Event aus der Sales Cloud …</div>
  <strong>Letztes empfangenes Event:</strong>
  <pre id="output">Noch kein Event empfangen.</pre>

  <script>
    // Für den ersten Test absichtlich KEIN fester Event-Name:
    // Wir wollen zunächst sehen, was SSCv2 tatsächlich an das Mashup sendet.
    window.addEventListener("message", function (event) {
      console.log("Message received from SSCv2", event.origin, event.data);

      document.getElementById("status").textContent =
        "Nachricht empfangen von: " + event.origin;

      let formatted;
      try {
        formatted = JSON.stringify(event.data, null, 2);
      } catch (e) {
        formatted = String(event.data);
      }

      document.getElementById("output").textContent = formatted;

      // Sobald das tatsächliche Payload bekannt ist, hier gezielt filtern, z. B.:
      // if (event.data?.eventName === "DEIN_EVENT_NAME") {
      //   const quoteId = event.data.parameters?.QuoteID;
      //   console.log("Quote ID:", quoteId);
      // }
    });
  </script>
</body>
</html>
