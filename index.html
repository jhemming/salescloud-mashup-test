<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angebot zur Unterschrift</title>
<style>
  :root{font-family:Arial,"Helvetica Neue",sans-serif;color:#1d2d3e;background:#f5f6f7}
  *{box-sizing:border-box} body{margin:0;background:#f5f6f7}
  header{background:#fff;border-bottom:1px solid #d9d9d9;padding:18px 24px}
  h1{font-size:20px;margin:0 0 4px} .sub{color:#556b82;font-size:13px}
  main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,.8fr);gap:18px;padding:18px;height:calc(100vh - 78px)}
  .card{background:#fff;border:1px solid #d9d9d9;border-radius:8px;overflow:hidden;min-height:0}
  .card h2{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid #e5e5e5}
  #pdf{width:100%;height:calc(100% - 47px);border:0;background:#eee}
  .side{padding:16px;overflow:auto}.field{margin-bottom:15px}.label{font-size:12px;color:#556b82;margin-bottom:4px}.value{font-size:14px;word-break:break-word}
  input{width:100%;padding:9px 10px;border:1px solid #89919a;border-radius:4px;font-size:14px}
  .status{padding:10px 12px;border-radius:4px;background:#eef5fc;font-size:13px;margin:14px 0;white-space:pre-wrap}
  .status.ok{background:#edf7ed}.status.err{background:#fff0f0}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  button{border:1px solid #0a6ed1;border-radius:4px;padding:9px 14px;font-weight:600;cursor:pointer;background:#fff;color:#0a6ed1}
  button.primary{background:#0a6ed1;color:#fff} button:disabled{opacity:.5;cursor:not-allowed}
  details{margin-top:18px;border-top:1px solid #eee;padding-top:12px} pre{font-size:11px;white-space:pre-wrap;word-break:break-all;background:#f7f7f7;padding:8px;max-height:220px;overflow:auto}
  @media(max-width:900px){main{grid-template-columns:1fr;height:auto}.card:first-child{height:650px}}
</style>
</head>
<body>
<header><h1>Angebot zur Unterschrift senden</h1><div class="sub">PDF prüfen und anschließend den Signaturprozess starten.</div></header>
<main>
  <section class="card"><h2>Dokumentvorschau</h2><iframe id="pdf" title="PDF Vorschau"></iframe></section>
  <section class="card side">
    <div class="field"><div class="label">Sales Quote UUID</div><div class="value" id="quoteId">–</div></div>
    <div class="field"><div class="label">Angebotsnummer</div><div class="value" id="displayId">–</div></div>
    <div class="field"><label class="label" for="recipient">Empfänger E-Mail</label><input id="recipient" type="email" placeholder="name@kunde.de"></div>
    <div id="status" class="status">Initialisierung …</div>
    <div class="actions"><button id="reload">PDF neu laden</button><button id="send" class="primary" disabled>Zur Unterschrift senden</button></div>
    <details><summary>Debug</summary><pre id="debug"></pre></details>
  </section>
</main>
<script>
const qs = new URLSearchParams(location.search);
const quoteId = qs.get('quoteId') || qs.get('QuoteID') || '';
const displayId = qs.get('displayId') || qs.get('DisplayID') || '';

// HIER den in DevTools gefundenen Preview-Endpunkt eintragen.
// Relative URL funktioniert nur, wenn der Endpunkt auf derselben Origin wie diese HTML-Seite liegt.
// Bei GitHub Pages ist Sales Cloud eine andere Origin -> CORS/Auth können den direkten fetch blockieren.
const PREVIEW_URL = qs.get('previewUrl') || 'REPLACE_WITH_PREVIEW_ENDPOINT';

// Optional: Falls /preview POST erwartet, hier GET auf POST ändern und buildPreviewBody() anpassen.
const PREVIEW_METHOD = 'GET';

const $ = id => document.getElementById(id);
$('quoteId').textContent = quoteId || 'nicht übergeben';
$('displayId').textContent = displayId || 'nicht übergeben';

function setStatus(text, kind='') { $('status').textContent=text; $('status').className='status '+kind; }
function debug(label, value){ $('debug').textContent += label+'\n'+(typeof value==='string'?value:JSON.stringify(value,null,2))+'\n\n'; }

function normalizeBase64(value){
  if (!value) return null;
  if (typeof value !== 'string') return null;
  value = value.trim();
  if (value.startsWith('data:application/pdf;base64,')) return value.split(',')[1];
  return value.replace(/\s/g,'');
}

function findPdfBase64(payload){
  if (typeof payload === 'string') {
    const s = payload.trim();
    if (s.startsWith('JVBER')) return normalizeBase64(s);
    if (s.startsWith('data:application/pdf;base64,')) return normalizeBase64(s);
    try { return findPdfBase64(JSON.parse(s)); } catch(e) { return null; }
  }
  if (!payload || typeof payload !== 'object') return null;
  const preferred = ['content','value','data','base64','pdf','document','fileContent','contentData'];
  for (const key of preferred) {
    if (key in payload) {
      const found = findPdfBase64(payload[key]);
      if (found) return found;
    }
  }
  for (const value of Object.values(payload)) {
    const found = findPdfBase64(value);
    if (found) return found;
  }
  return null;
}

function showPdf(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const blob = new Blob([bytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  $('pdf').src = url;
  $('send').disabled = false;
  setStatus('PDF wurde geladen. Bitte Dokument und Empfänger prüfen.', 'ok');
}

function buildPreviewUrl(){
  if (PREVIEW_URL === 'REPLACE_WITH_PREVIEW_ENDPOINT') throw new Error('PREVIEW_URL ist noch nicht konfiguriert.');
  // Falls der Preview-Endpunkt die Quote-ID als Query-Parameter erwartet, hier ergänzen.
  return PREVIEW_URL.replace('{quoteId}', encodeURIComponent(quoteId));
}

function buildPreviewBody(){
  // Nur relevant, falls PREVIEW_METHOD = 'POST'. Payload an den echten /preview Request anpassen.
  return JSON.stringify({ quoteId });
}

async function loadPreview(){
  $('send').disabled = true; $('pdf').src='about:blank'; $('debug').textContent='';
  setStatus('PDF wird geladen …');
  try {
    const url = buildPreviewUrl();
    debug('Preview URL:', url);
    const options = { method: PREVIEW_METHOD, credentials: 'include', headers: { 'Accept':'application/json, application/pdf, text/plain, */*' } };
    if (PREVIEW_METHOD === 'POST') { options.headers['Content-Type']='application/json'; options.body=buildPreviewBody(); }
    const response = await fetch(url, options);
    debug('HTTP:', response.status+' '+response.statusText);
    debug('Content-Type:', response.headers.get('content-type') || '');
    if (!response.ok) throw new Error('Preview-Aufruf fehlgeschlagen: HTTP '+response.status);

    const ct = (response.headers.get('content-type') || '').toLowerCase();
    if (ct.includes('application/pdf')) {
      const blob = await response.blob();
      $('pdf').src = URL.createObjectURL(blob); $('send').disabled=false; setStatus('PDF wurde geladen.', 'ok'); return;
    }

    const text = await response.text();
    debug('Response Anfang:', text.slice(0,1500));
    const base64 = findPdfBase64(text);
    if (!base64) throw new Error('In der Preview-Antwort wurde kein PDF/Base64 gefunden.');
    showPdf(base64);
  } catch(err) {
    console.error(err); debug('Fehler:', err.message); setStatus(err.message+'\n\nBei GitHub Pages sind CORS bzw. die Sales-Cloud-Authentifizierung mögliche Ursachen.', 'err');
  }
}

$('reload').addEventListener('click', loadPreview);
$('send').addEventListener('click', () => {
  // Noch KEIN produktiver Versand. Hier später den abgesicherten Backend-/CPI-Aufruf anbinden.
  setStatus('Test: Versandaktion wurde ausgelöst. CPI-Aufruf ist noch nicht konfiguriert.', 'ok');
});

if (PREVIEW_URL !== 'REPLACE_WITH_PREVIEW_ENDPOINT') loadPreview();
else setStatus('HTML ist bereit. Trage jetzt den echten /preview-Endpunkt in PREVIEW_URL ein.', '');
</script>
</body>
</html>
